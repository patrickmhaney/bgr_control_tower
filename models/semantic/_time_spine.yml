version: 2

models:
  - name: metricflow_time_spine
    description: >
      "Grain: one row per calendar day. Required by MetricFlow; a projection of
      dim_date so the project has one calendar, not two."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        tests: [unique, not_null]
