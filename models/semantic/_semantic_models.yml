# Generated by scripts/compile_metrics.py from semantic/metrics/. Do not edit by hand - edit the metric definition and recompile.
#
# dbt semantic models and metrics, generated from the tool-neutral
# registry. This is one of several compilation targets - the registry,
# not this file, is the source of truth.
#
# NOT EXPRESSIBLE IN METRICFLOW, and therefore absent below:
#   customer_unmatched_rate - base model dim_customer has no date dimension, and MetricFlow requires an aggregation time dimension on every measure.
# These metrics compile correctly to DAX and to Cube. The gap is the
# tool's, not the registry's - which is the argument for keeping the
# registry tool-neutral.
version: 2

semantic_models:
- name: sm_fct_invoice_line
  description: X3 invoice lines with settlement dates. Reconciles to GL 41000.
  model: ref('fct_invoice_line')
  primary_entity: fct_invoice_line
  defaults:
    agg_time_dimension: metric_date
  entities:
  - name: customer
    type: foreign
    expr: customer_key
  - name: site
    type: foreign
    expr: site_code
  - name: item
    type: foreign
    expr: item_code
  dimensions:
  - name: metric_date
    type: time
    expr: invoice_date_key
    type_params:
      time_granularity: day
  - name: payment_term_code
    type: categorical
    expr: payment_term_code
  - name: document_currency_code
    type: categorical
    expr: document_currency_code
  measures:
  - name: dso_days_to_pay_proxy_numerator
    agg: sum
    expr: days_to_pay_settled_only
    description: Days to pay
  - name: dso_days_to_pay_proxy_denominator
    agg: count
    expr: days_to_pay_settled_only
    description: Settled invoice lines
  - name: unsettled_invoice_rate_numerator
    agg: count
    expr: case when is_unsettled then invoice_number end
    description: Unsettled lines
  - name: unsettled_invoice_rate_denominator
    agg: count
    expr: invoice_number
    description: Invoice lines
- name: sm_fct_shipment
  description: Shipment header from Pangea, enriched with charge totals, tracking milestones and the resolved
    X3 order and customer.
  model: ref('fct_shipment')
  primary_entity: fct_shipment
  defaults:
    agg_time_dimension: metric_date
  entities:
  - name: customer
    type: foreign
    expr: customer_key
  - name: site
    type: foreign
    expr: site_code
  - name: carrier
    type: foreign
    expr: carrier_scac
  dimensions:
  - name: metric_date
    type: time
    expr: ship_date_key
    type_params:
      time_granularity: day
  - name: service_level
    type: categorical
    expr: service_level
  - name: transport_mode
    type: categorical
    expr: transport_mode
  - name: shipment_status
    type: categorical
    expr: shipment_status
  - name: destination_state
    type: categorical
    expr: destination_state
  - name: customer_resolution_method
    type: categorical
    expr: customer_resolution_method
  measures:
  - name: cost_per_order_numerator
    agg: sum
    expr: case when has_order_reference then shipment_cost_usd end
    description: Fulfillment cost
  - name: cost_per_order_denominator
    agg: count_distinct
    expr: case when has_order_reference then sales_order_number end
    description: Shipped orders
  - name: cost_per_shipment_numerator
    agg: sum
    expr: shipment_cost_usd
    description: Shipment cost
  - name: cost_per_shipment_denominator
    agg: count
    expr: shipment_id
    description: Shipments
  - name: on_time_delivery_rate_numerator
    agg: count
    expr: case when is_on_time_vs_carrier_promise then shipment_id end
    description: On-time shipments
  - name: on_time_delivery_rate_denominator
    agg: count
    expr: case when is_on_time_vs_carrier_promise is not null then shipment_id end
    description: Delivered shipments
  - name: order_reference_coverage_rate_numerator
    agg: count
    expr: case when has_order_reference then shipment_id end
    description: Shipments with a resolved order
  - name: order_reference_coverage_rate_denominator
    agg: count
    expr: shipment_id
    description: Shipments
metrics:
- name: cost_per_order_numerator
  label: Cost Per Order - numerator
  description: Fulfillment cost
  type: simple
  type_params:
    measure:
      name: cost_per_order_numerator
  meta:
    component_of: cost_per_order
- name: cost_per_order_denominator
  label: Cost Per Order - denominator
  description: Shipped orders
  type: simple
  type_params:
    measure:
      name: cost_per_order_denominator
  meta:
    component_of: cost_per_order
- name: cost_per_order
  label: Cost Per Order
  description: 'The average fulfillment cost of delivering one sales order, measured as carrier charges
    divided by distinct shipped orders. The cost pool is freight and accessorials only. It is not fully
    loaded: the general ledger in this estate contains revenue, receivables and tax and nothing else,
    so warehouse labour, handling and overhead are not represented.'
  type: ratio
  type_params:
    numerator: cost_per_order_numerator
    denominator: cost_per_order_denominator
  meta:
    status: provisional
    owner: TBD
    definition_file: semantic/metrics/cost_per_order.yml
- name: cost_per_shipment_numerator
  label: Cost Per Shipment - numerator
  description: Shipment cost
  type: simple
  type_params:
    measure:
      name: cost_per_shipment_numerator
  meta:
    component_of: cost_per_shipment
- name: cost_per_shipment_denominator
  label: Cost Per Shipment - denominator
  description: Shipments
  type: simple
  type_params:
    measure:
      name: cost_per_shipment_denominator
  meta:
    component_of: cost_per_shipment
- name: cost_per_shipment
  label: Cost Per Shipment
  description: The average freight cost of moving one shipment, measured as total carrier charges divided
    by shipments. Charges are the sum of the line-level charge codes on the shipment - freight, fuel surcharge
    and accessorials - which is what the carrier will invoice and what a cost analyst can decompose. It
    is not the cost of goods, and it excludes internal handling labour.
  type: ratio
  type_params:
    numerator: cost_per_shipment_numerator
    denominator: cost_per_shipment_denominator
  meta:
    status: active
    owner: TBD
    definition_file: semantic/metrics/cost_per_shipment.yml
- name: dso_days_to_pay_proxy_numerator
  label: DSO (days-to-pay proxy) - numerator
  description: Days to pay
  type: simple
  type_params:
    measure:
      name: dso_days_to_pay_proxy_numerator
  meta:
    component_of: dso_days_to_pay_proxy
- name: dso_days_to_pay_proxy_denominator
  label: DSO (days-to-pay proxy) - denominator
  description: Settled invoice lines
  type: simple
  type_params:
    measure:
      name: dso_days_to_pay_proxy_denominator
  meta:
    component_of: dso_days_to_pay_proxy
- name: dso_days_to_pay_proxy
  label: DSO (days-to-pay proxy)
  description: The average number of days between invoicing a customer and that invoice being settled,
    across settled invoices only. This is a proxy for Days Sales Outstanding, not DSO. Textbook DSO divides
    an accounts receivable balance by revenue over a period; that requires an open-AR position and cash
    application, neither of which exists in any source system here.
  type: ratio
  type_params:
    numerator: dso_days_to_pay_proxy_numerator
    denominator: dso_days_to_pay_proxy_denominator
  meta:
    status: provisional
    owner: TBD
    definition_file: semantic/metrics/dso_days_to_pay_proxy.yml
- name: on_time_delivery_rate_numerator
  label: On-Time Delivery - numerator
  description: On-time shipments
  type: simple
  type_params:
    measure:
      name: on_time_delivery_rate_numerator
  meta:
    component_of: on_time_delivery_rate
- name: on_time_delivery_rate_denominator
  label: On-Time Delivery - denominator
  description: Delivered shipments
  type: simple
  type_params:
    measure:
      name: on_time_delivery_rate_denominator
  meta:
    component_of: on_time_delivery_rate
- name: on_time_delivery_rate
  label: On-Time Delivery
  description: The share of delivered shipments that arrived on or before the promised delivery date.
    The promise is the carrier's committed delivery date, not the customer's requested date - the two
    give materially different answers and the business has not yet chosen between them.
  type: ratio
  type_params:
    numerator: on_time_delivery_rate_numerator
    denominator: on_time_delivery_rate_denominator
  meta:
    status: active
    owner: TBD
    definition_file: semantic/metrics/on_time_delivery_rate.yml
- name: order_reference_coverage_rate_numerator
  label: Shipment Order Reference Coverage - numerator
  description: Shipments with a resolved order
  type: simple
  type_params:
    measure:
      name: order_reference_coverage_rate_numerator
  meta:
    component_of: order_reference_coverage_rate
- name: order_reference_coverage_rate_denominator
  label: Shipment Order Reference Coverage - denominator
  description: Shipments
  type: simple
  type_params:
    measure:
      name: order_reference_coverage_rate_denominator
  meta:
    component_of: order_reference_coverage_rate
- name: order_reference_coverage_rate
  label: Shipment Order Reference Coverage
  description: 'The share of shipments that resolve to a Sage X3 sales order. This bounds every metric
    that has to cross the shipment-to-order boundary: Cost Per Order is computed over shipped orders only,
    and On-Time Delivery measured against the customer''s requested date is only available for the shipments
    this figure covers.'
  type: ratio
  type_params:
    numerator: order_reference_coverage_rate_numerator
    denominator: order_reference_coverage_rate_denominator
  meta:
    status: active
    owner: TBD
    definition_file: semantic/metrics/order_reference_coverage_rate.yml
- name: unsettled_invoice_rate_numerator
  label: Unsettled Invoice Rate - numerator
  description: Unsettled lines
  type: simple
  type_params:
    measure:
      name: unsettled_invoice_rate_numerator
  meta:
    component_of: unsettled_invoice_rate
- name: unsettled_invoice_rate_denominator
  label: Unsettled Invoice Rate - denominator
  description: Invoice lines
  type: simple
  type_params:
    measure:
      name: unsettled_invoice_rate_denominator
  meta:
    component_of: unsettled_invoice_rate
- name: unsettled_invoice_rate
  label: Unsettled Invoice Rate
  description: 'The share of invoice lines with no settlement date. This is the mandatory companion to
    the DSO proxy: the proxy is computed over settled invoices only, so this figure is the size of what
    it excludes. Published on its own, the proxy looks better than reality by exactly this much.'
  type: ratio
  type_params:
    numerator: unsettled_invoice_rate_numerator
    denominator: unsettled_invoice_rate_denominator
  meta:
    status: active
    owner: TBD
    definition_file: semantic/metrics/unsettled_invoice_rate.yml
