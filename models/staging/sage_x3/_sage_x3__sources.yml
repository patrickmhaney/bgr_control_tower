version: 2

sources:
  - name: sage_x3
    database: "{{ var('source_database') }}"
    schema: sage_x3
    description: >
      Sage X3 ERP. High-fidelity mock: `_0` column suffixes, array columns,
      `UPDTICK_0` optimistic-lock counters, CHAR-padded keys, SQL Server
      sentinel dates (1753-01-01), integer local menus, no enforced foreign
      keys. Table and column names are close to a real X3 folder but must be
      validated against the client install before production DDL.
    loaded_at_field: null
    tables:
      - name: COMPANY
        description: Legal entity. Two rows - a US and a Canadian company.
      - name: FACILITY
        description: Site. Three rows - Dallas, Reno, Toronto.
      - name: BPARTNER
        description: Business partner master. BPCFLG_0/BPSFLG_0 flag the roles.
      - name: BPCUSTOMER
        description: >
          Customer role extension of BPARTNER. REP_0/REP_1 is an X3 array
          column - about 18% of customers carry a second rep.
      - name: BPSUPPLIER
        description: Supplier role extension of BPARTNER.
      - name: BPADDRESS
        description: Partner x address code. Multiple ship-tos per customer.
      - name: ITMMASTER
        description: Item master. ITMSTA_0 is a local menu (chapter 20).
      - name: ITMFACILIT
        description: Item x site replenishment parameters.
      - name: SORDER
        description: >
          Sales order header. BPCORD_0 is CHAR-padded. SHIDAT_0 carries the
          1753-01-01 sentinel on 402 rows.
      - name: SORDERQ
        description: >
          Sales order line, quantity side. ITMREF_0 is CHAR-padded on every
          row. Joins to SORDERP on SOHNUM_0 + SOPLIN_0.
      - name: SORDERP
        description: >
          Sales order line, price side. ITMDES1_0 is denormalised at order
          time and drifts from ITMMASTER - real X3 behaviour, not a defect.
      - name: SINVOICEV
        description: >
          Sales invoice header. PAYDAT_0 carries the sentinel on 492 rows.
          There is no cash application table anywhere in the source estate.
      - name: SINVOICED
        description: Sales invoice line. Carries SOHNUM_0/SOPLIN_0 back to the order.
      - name: STOCK
        description: Current on-hand by item, site, lot and location.
      - name: STOJOU
        description: >
          Stock journal. TRSTYP_0 is a local menu (chapter 700). Every
          movement resolves to the document that caused it: VCRNUM_0 carries
          the receipt (PTH), count session (CNT), return (RTN) or order number.
          Adjustments (code 3) are posted BY a count session and are still not
          a substitute for one - they record the correction, not the count.
      - name: PORDER
        description: Purchase order header.
      - name: PORDERQ
        description: >
          Purchase order line with expected and actual receipt. RCPDAT_0
          carries the sentinel on 576 rows. It is a denormalised copy of the
          LAST receipt - PRECEIPTD is the document, and the two disagree on
          any line received more than once.
      - name: GACCENTRY
        description: >
          GL journal header. Two journals: sales (JOU_0 = SAL, TYP_0 = SIH
          for invoices and SCH for credit memos) and purchasing (PUR / PIH).
      - name: GACCENTRYD
        description: >
          GL journal line. AMTCUR_0 is document currency, AMTLOC_0 is company
          currency; the ratio is the only FX signal in the estate.
      - name: REPRESENT
        description: >
          Sales representative. REPNAM_0 is "LASTNAME FIRSTNAME" upper case -
          the only link to Paycom.
      - name: APLSTD
        description: Local menu labels, keyed by chapter and code.
      - name: ATEXTRA
        description: Field-level translations (FRA here).
      - name: SRETURN
        description: >
          Customer return header. RTNDAT_0 is the return date and can be
          months after the order - returns cross period boundaries.
      - name: SRETURND
        description: >
          Customer return line. SOHNUM_0 references the original order and is
          unreliable on ~8% of rows: blank or lowercased.
      - name: PRECEIPT
        description: >
          Goods receipt header. The receipt as a document, with its own date -
          which is what makes a late receipt against an old PO extractable.
      - name: PRECEIPTD
        description: >
          Goods receipt line, carrying the PO line reference. A PO line
          received in two deliveries has two rows here and one RCPDAT_0 on
          PORDERQ.
      - name: PINVOICE
        description: Supplier (AP) invoice header.
      - name: PINVOICED
        description: >
          Supplier invoice line. POHNUM_0 and PTHNUM_0 are the PO and receipt
          references; either can be null, and a null is meaningful - it is
          maverick spend or an invoice with no receipt, not a data error.
      - name: STOCOUNT
        description: >
          Inventory count session. NAME UNVERIFIED - the counting mechanism is
          right, the table name is constructed. Validate against the install.
      - name: STOCOUNTD
        description: >
          Counted position. QTYTHEO_0 is the system quantity AT COUNT TIME and
          cannot be reconstructed later. NAME UNVERIFIED.
