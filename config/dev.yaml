# Azure dev. Storage URLs use the environment's storage account; the container
# app's managed identity reaches them, so no keys appear here. Secrets (the
# Postgres password, source credentials) come from Key Vault as CT_* variables.
env: dev
data_dir: /tmp/ct
mock_db: /tmp/ct/mock_sources.duckdb
bronze_root: az://bronze/dev
warehouse_path: /tmp/ct/warehouse.duckdb
exports_root: az://exports/dev
serving_destination: postgres
serving_url: postgresql://ctadmin@ct-dev-pg.postgres.database.azure.com:5432/serving
mdm_provider: splink
source_mode: mock
dbt_target: azure
storage_account: ctdevlake
