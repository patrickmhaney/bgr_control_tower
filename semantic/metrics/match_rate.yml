name: match_rate
label: Match Rate
status: blocked

description: >
  The share of supplier invoices that match their purchase order and goods
  receipt within tolerance - the three-way match. Definition pending.

grain: To be determined. Most likely one supplier invoice line.

base_model: null
numerator: null
denominator: null
filters: []
dimensions: [date, site]

format: percent
decimals: 1
direction: higher_is_better

owner: TBD
owner_proposed: AP Manager

blocked_reason: >
  A three-way match needs a purchase order, a goods receipt and a supplier
  invoice. Two of the three exist:

    - Purchase order: present. PORDER 1,400 headers, PORDERQ 2,959 lines.
    - Receipt: present, but ONLY as columns on the PO line (RCPQTY_0,
      RCPDAT_0). 2,383 lines carry a receipt quantity; 576 carry the
      1753-01-01 sentinel receipt date. There is no receipt transaction and no
      receipt document: STOJOU's 4,217 purchase movements (VCRTYP_0 = 'PTH')
      carry document numbers of the form PTH######, none of which resolve to a
      POHNUM_0. So a receipt cannot be dated, sequenced, split across
      deliveries, or attributed to a receiving user - the PO line records only
      that a quantity arrived and when the last one did.
    - Supplier invoice: absent. There is no AP invoice table, no AP control
      account (GACCENTRYD holds only 11100, 22300 and 41000) and no AP journal
      (GACCENTRY.JOU_0 is SAL on all 3,564 rows).

  A two-way PO-to-receipt match rate is computable - 2,064 of 2,959 lines
  (69.8%) received exactly the ordered quantity - but it is a different metric
  and shipping it under this name would misrepresent what was checked. It is
  recorded here as a note, not as a substitute.

unblock_requires:
  - An AP invoice source with supplier, invoice number, PO reference, line
    detail and amounts.
  - A goods receipt transaction carrying the PO reference. Without one, even a
    two-way match is limited to a single aggregate quantity per PO line, and
    partial or multi-delivery receipts cannot be matched at all.
  - A tolerance policy - quantity and price variance thresholds that define
    "matched".
