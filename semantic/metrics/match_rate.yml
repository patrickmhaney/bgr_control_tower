name: match_rate
label: Match Rate
status: provisional

description: >
  The share of supplier invoice lines that agree with both the purchase order
  and the goods receipt within tolerance - the three-way match. A line matches
  when it references a purchase order, the ordered quantity was received, the
  invoiced quantity agrees with the received quantity, and the invoiced price
  agrees with the ordered price.

grain: One supplier invoice line.

base_model: fct_supplier_invoice_line

numerator:
  agg: count
  column: supplier_invoice_line_number
  filter: {column: is_three_way_matched, op: is_true}
  label: Matched lines

denominator:
  agg: count
  column: supplier_invoice_line_number
  filter: {column: is_three_way_matched, op: is_not_null}
  label: Invoice lines

filters: []

dimensions: [date, site, item]

format: percent
decimals: 1
direction: higher_is_better

owner: TBD
owner_proposed: AP Manager

provisional_reason: >
  The tolerance policy is a business decision that has not been made. Exact
  quantity and 2% price is the assumption, and the rate is highly sensitive to
  it - AP departments commonly allow a quantity band as well, which would move
  this number several points. Until AP sets a policy the rate measures the
  policy as much as the process. See open question 14.

lineage_notes: >
  sage_x3.PINVOICED joined to PORDERQ and to receipts summed from PRECEIPTD in
  int_supplier_invoice_match, then carried on fct_supplier_invoice_line as
  is_three_way_matched.

  Receipts are summed per PO line rather than matched one-to-one, because a
  line can be received across several deliveries. Matching to a single receipt
  row would fail every partial delivery for no reason and understate the rate.

  The reason a line fails is kept on the fact as match_result -
  no_purchase_order, po_line_not_found, not_received, quantity_variance or
  price_variance. A match rate on its own says there is a problem; the reason
  says where to go. Maverick spend (no PO at all) is a governance finding, not
  a data quality one, and is also flagged as is_maverick_spend.

  Every supplier invoice in this estate is USD, so no FX applies. The metric
  counts LINES, not value - a policy choice, since a value-weighted match rate
  would let one large clean invoice mask many small failures.

assumptions:
  - name: match_qty_tolerance_pct
    var: match_qty_tolerance_pct
    value: 0.0
    question: Q14
  - name: match_price_tolerance_pct
    var: match_price_tolerance_pct
    value: 2.0
    question: Q14

blocked_reason: null
