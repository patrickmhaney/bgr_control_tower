name: return_rate
label: Return Rate
status: provisional

description: >
  The share of invoiced value that customers subsequently return, measured as
  returned line value divided by invoiced line value on the same order lines.
  Both sides are order-line amounts in the reporting currency, so the ratio is
  additive and slices the same way at every level.

grain: One sales order line.

base_model: fct_sales_order_line

numerator:
  agg: sum
  column: returned_amount_usd
  label: Returned value

denominator:
  agg: sum
  column: invoiced_amount_usd
  label: Invoiced value

filters: []

dimensions: [date, customer, site, item]

format: percent
decimals: 1
direction: lower_is_better

owner: TBD
owner_proposed: Director of Customer Service

provisional_reason: >
  The denominator basis is a business decision that has not been made. Invoiced
  value is the assumption; ordered value and shipped value are both computable
  and give different answers, because an order can be invoiced in part. The
  date basis is the same kind of choice - order date is used, return date is
  the alternative, and they move a monthly rate materially. See open questions
  16 and 17.

lineage_notes: >
  sage_x3.SRETURND, resolved back to the order line in int_sales_return_line
  and summed onto fct_sales_order_line as returned_amount_usd. The denominator
  is the order line's own net amount, converted at the same FX rate as the
  numerator, so currency cancels rather than being applied twice.

  Returns are dated on the RETURN, not the order. A return raised in March
  against a January order counts in March on a return-date slice and in
  January on an order-date slice, and the two give different answers. The
  date dimension on this metric is the ORDER date, because the denominator has
  no other date - which means the metric answers "what fraction of what we
  sold that month came back", not "how much came back this month". Both are
  legitimate; open question 17 asks the business which one it wants on the
  dashboard.

  Two caveats carried from the source. 8% of returns arrive with an order
  reference that resolves to nothing; those are excluded from the numerator
  because they cannot be attributed to a denominator line, and their value is
  published separately as a coverage figure. 14% of returns have not yet been
  credited at extract time, so a rate measured on recent months will rise as
  credits post.

assumptions:
  - name: return_rate_basis
    var: return_rate_basis
    value: invoiced
    question: Q16

blocked_reason: null
