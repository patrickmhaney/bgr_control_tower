name: inventory_accuracy
label: Inventory Accuracy
status: provisional

description: >
  The share of counted stock positions where the counted quantity agrees with
  the system quantity within tolerance. Measured by position - one item, site,
  location and lot - which is the common warehouse convention.

grain: One counted stock position.

base_model: fct_inventory_count_line

numerator:
  agg: count
  column: count_line_number
  filter: {column: is_accurate_position, op: is_true}
  label: Accurate positions

denominator:
  agg: count
  column: count_line_number
  filter: {column: is_accurate_position, op: is_not_null}
  label: Positions counted

filters: []

dimensions: [date, site, item]

format: percent
decimals: 1
direction: higher_is_better

owner: TBD
owner_proposed: Warehouse Operations Manager

provisional_reason: >
  Two decisions are outstanding. The tolerance band is assumed to be zero -
  a position is accurate only on an exact match - and many warehouses allow a
  quantity or value band instead. The measurement basis is assumed to be
  position rather than unit or value, which flatters sites whose errors are
  concentrated in a few large positions. See open question 15.

  The source table names are also unverified against a real X3 folder.

lineage_notes: >
  sage_x3.STOCOUNTD, one row per counted position, carried on
  fct_inventory_count_line with is_accurate_position.

  The denominator is what makes this metric possible and it comes from the
  count session, not from the stock journal. STOJOU adjustments record the
  correction, not the count: they can say how much was wrong but not how much
  was checked, so an accuracy percentage built on them would be inventing its
  own denominator. The count session is the only source that carries both.

  system_qty is the theoretical quantity AT COUNT TIME. It is not recoverable
  from current stock, so this metric cannot be rebuilt retrospectively if the
  count tables are dropped from the extract.

  Accuracy is by position, not by unit. A site that miscounts one pallet of
  5,000 and gets 400 other positions right scores 99.75% here and far worse on
  a unit basis. Both are legitimate measures of different things.

  VERIFY THE SOURCE TABLE NAMES against the client's X3 folder. The counting
  mechanism is right; STOCOUNT / STOCOUNTD are constructed names.

assumptions:
  - name: inventory_accuracy_tolerance_pct
    var: inventory_accuracy_tolerance_pct
    value: 0.0
    question: Q15

blocked_reason: null
