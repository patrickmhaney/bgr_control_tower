version: 2

seeds:
  - name: process
    description: >
      The nine business processes, by acronym. Expansions are not confirmed by
      the business and are deliberately absent - do not guess at them. Six of
      the nine currently carry no metrics; they are listed here so the
      architecture is exercised against the empty case rather than assuming it
      away.
    columns:
      - name: process_code
        description: Process acronym. The only identifier used anywhere in this project.
        tests: [unique, not_null]
      - name: display_order
        description: Dashboard ordering.
        tests: [not_null]

  - name: process_metric_map
    description: >
      Many-to-many between processes and metrics. This is the join that keeps
      metrics from being owned by processes - a metric appearing on two
      dashboards is two rows here, never two definitions. Adding a metric to a
      second dashboard is a one-line change to this file.
    columns:
      - name: process_code
        description: Process acronym.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('process')
                field: process_code
      - name: metric_name
        description: >
          Metric name, matching the `name` field of an entry in
          semantic/metrics/. The relationships test below is what makes the
          seed and the registry impossible to drift apart - a typo here fails
          the build rather than producing an empty dashboard tile.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('metric_registry')
                field: metric_name
      - name: slot
        description: Dashboard slot M1-M4. Four metrics per dashboard.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['M1', 'M2', 'M3', 'M4']
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [process_code, slot]
          config:
            alias: process_metric_map_one_metric_per_slot

  - name: site_code_crosswalk
    description: >
      Site identity across the three systems that name sites differently.
      X3 uses US001/US002/CA001, Paycom uses DAL-01/RNO-01/TOR-01, Netstock
      uses the X3 codes directly. Three rows and a hand-maintained seed is the
      right answer here - deriving this from data would be inventing a
      relationship that does not exist in any source.
    columns:
      - name: x3_site_code
        description: FACILITY.FCY_0. The conformed site key.
        tests: [unique, not_null]
      - name: paycom_location_code
        description: paycom.employee.location_code / paycom.check.location_code.
        tests: [unique, not_null]
      - name: netstock_location_code
        description: netstock.item_location.location_code. Identical to the X3 code.
        tests: [unique, not_null]

  - name: metric_registry
    description: >
      GENERATED by scripts/compile_metrics.py from semantic/metrics/. The
      metric registry compiled into the warehouse so that dbt can enforce
      referential integrity against process_metric_map, and so Power BI can
      bind metric metadata - status, owner, caveats - without a second source
      of truth. Do not edit; edit the YAML and recompile.
    columns:
      - name: metric_name
        description: Unique. One definition per metric is enforced here and in the compiler.
        tests: [unique, not_null]
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'provisional', 'blocked']
      - name: owner
        description: >
          Required, currently TBD on every metric. The test asserts the field
          is populated, not that it names a person - so "nobody has signed off
          on any of these" stays visible instead of resolving to silence.
        tests: [not_null]
      - name: base_model
        description: Empty for blocked metrics, which carry no SQL by design.

  - name: legal_suffix
    description: >
      Legal-entity suffixes stripped when normalising a company name for entity
      resolution. A seed rather than a regex inline in a macro because this is
      the single thing the client will iterate on hardest once real names
      arrive - GmbH, Pty, SA, BV, Holdings, Industries - and every other
      business-tunable list in this project is a seed or a var. It also makes
      the tuning auditable: a match rate moving is then traceable to a row
      someone added.

      Order does not matter; macros/text_keys.sql aggregates the column into a
      regex alternation at compile time.
    columns:
      - name: suffix
        description: Upper case, no punctuation. Matched only at the end of a name.
        tests: [unique, not_null]
      - name: jurisdiction
        description: Where the form is used. Documentation only.
