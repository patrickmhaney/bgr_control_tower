    data_type: varchar
    description: X3 item code. UNKNOWN when it did not resolve.
    tests:
    - relationships:
        arguments:
          to: ref('dim_item')
          field: item_code
  - name: site_code
    data_type: varchar
    description: X3 site code. UNKNOWN when it did not resolve.
