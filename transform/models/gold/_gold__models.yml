      enforced: true
    meta:
      owner: data-platform
  columns:
  - name: invoice_number
    data_type: varchar
    tests:
    - not_null
  - name: invoice_line_number
    data_type: bigint
    tests:
    - not_null
  - name: invoice_date
    data_type: date
  - name: payment_date
    data_type: date
  - name: customer_key
    data_type: varchar
    description: Golden customer key from MDM. UNKNOWN when the source record did not resolve.
    tests:
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: item_code
    data_type: varchar
    description: X3 item code. UNKNOWN when it did not resolve.
    tests:
    - relationships:
        arguments:
