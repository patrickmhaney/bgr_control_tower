  - name: stock_unit
    data_type: varchar
  - name: item_status
    data_type: varchar
  - name: is_active_item
    data_type: integer
  - name: base_sales_price
    data_type: decimal(18,4)
  - name: base_purchase_price
    data_type: decimal(18,4)
  - name: best_abc_class
    data_type: varchar
  - name: best_xyz_class
    data_type: varchar
  - name: planned_location_count
    data_type: integer
  - name: has_high_stockout_risk
    data_type: integer
  - name: netstock_last_sync_date
    data_type: date
  - name: is_planned_in_netstock
    data_type: integer
- name: dim_site
  description: One row per site. X3 codes are the conformed key.
  config:
    contract:
      enforced: true
    meta:
      owner: data-platform
  columns:
  - name: site_code
    data_type: varchar
    description: X3 site code. UNKNOWN when it did not resolve.
    tests:
    - unique
    - not_null
  - name: site_name
    data_type: varchar
  - name: city
    data_type: varchar
  - name: state_province
    data_type: varchar
  - name: country_code
    data_type: varchar
  - name: company_code
    data_type: varchar
  - name: company_name
    data_type: varchar
  - name: netstock_location_code
    data_type: varchar
- name: dim_supplier
  description: One row per supplier, with X3's and Netstock's lead times side by side.
  config:
    contract:
      enforced: true
    meta:
      owner: data-platform
  columns:
  - name: supplier_code
    data_type: varchar
    tests:
