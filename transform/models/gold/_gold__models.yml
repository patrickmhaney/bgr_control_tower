  - name: netstock_lead_time_days
    data_type: integer
- name: fct_sales_order_line
  description: One row per sales order line. Feeds Return Rate and Order Fill Rate.
  config:
    contract:
      enforced: true
    meta:
      owner: data-platform
  columns:
  - name: sales_order_number
    data_type: varchar
    tests:
    - not_null
  - name: sales_order_line_number
    data_type: bigint
    tests:
    - not_null
  - name: order_date
    data_type: date
  - name: requested_delivery_date
    data_type: date
  - name: customer_key
    data_type: varchar
    description: Golden customer key from MDM. UNKNOWN when the source record did not resolve.
    tests:
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: item_code
    data_type: varchar
    description: X3 item code. UNKNOWN when it did not resolve.
    tests:
    - relationships:
        arguments:
          to: ref('dim_item')
          field: item_code
  - name: site_code
    data_type: varchar
    description: X3 site code. UNKNOWN when it did not resolve.
    tests:
    - relationships:
        arguments:
          to: ref('dim_site')
          field: site_code
  - name: employee_key
    data_type: varchar
    description: Golden employee key of the person who performed the activity. E-UNKNOWN for system users
      (EDI, WMS) and unresolved users.
    tests:
    - relationships:
        arguments:
          to: ref('dim_employee')
          field: employee_key
  - name: rep_code
    data_type: varchar
  - name: order_status
    data_type: varchar
  - name: document_currency_code
    data_type: varchar
  - name: ordered_qty
    data_type: decimal(18,4)
  - name: delivered_qty
    data_type: decimal(18,4)
  - name: line_net_amount_doc
    data_type: decimal(18,4)
  - name: line_net_amount_usd
    data_type: decimal(18,4)
  - name: invoiced_amount_usd
    data_type: decimal(18,4)
    description: Invoiced value of the line. Return Rate's denominator (open question 16).
  - name: returned_amount_usd
    data_type: decimal(18,4)
    description: Credit value of returns raised against the line. Return Rate's numerator.
  - name: is_invoiced
    data_type: integer
  - name: is_returned
    data_type: integer
  - name: is_fully_delivered
    data_type: integer
  - name: is_cancelled
    data_type: integer
  - name: order_line_count
    data_type: integer
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - sales_order_number
        - sales_order_line_number
- name: fct_delivery_line
  description: One row per delivery line - one shipment of one order line. Feeds On-Time Delivery.
  config:
    contract:
      enforced: true
    meta:
      owner: data-platform
  columns:
  - name: delivery_number
    data_type: varchar
    tests:
    - not_null
  - name: delivery_line_number
    data_type: bigint
    tests:
    - not_null
  - name: sales_order_number
    data_type: varchar
  - name: sales_order_line_number
    data_type: bigint
  - name: ship_date
    data_type: date
  - name: delivered_date
    data_type: date
  - name: requested_delivery_date
    data_type: date
  - name: customer_key
    data_type: varchar
    description: Golden customer key from MDM. UNKNOWN when the source record did not resolve.
    tests:
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: item_code
    data_type: varchar
    description: X3 item code. UNKNOWN when it did not resolve.
    tests:
    - relationships:
        arguments:
          to: ref('dim_item')
          field: item_code
  - name: site_code
    data_type: varchar
    description: X3 site code. UNKNOWN when it did not resolve.
    tests:
    - relationships:
        arguments:
          to: ref('dim_site')
          field: site_code
  - name: employee_key
    data_type: varchar
    description: Golden employee key of the person who performed the activity. E-UNKNOWN for system users
      (EDI, WMS) and unresolved users.
    tests:
    - relationships:
        arguments:
          to: ref('dim_employee')
          field: employee_key
  - name: delivered_qty
    data_type: decimal(18,4)
  - name: is_delivered
    data_type: integer
    description: 1 once proof of delivery has arrived. Undelivered lines are outside On-Time Delivery's
      denominator.
  - name: is_on_time
    data_type: integer
    description: 1 when delivered on or before the customer's requested date (open question 1).
  - name: days_late
    data_type: integer
  - name: delivery_line_count
    data_type: integer
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - delivery_number
        - delivery_line_number
- name: fct_invoice_line
