          to: ref('dim_employee')
          field: employee_key
  - name: purchase_order_number
    data_type: varchar
  - name: receipt_number
    data_type: varchar
  - name: match_result
    data_type: varchar
    description: matched, quantity_variance, price_variance, not_received, po_line_not_found or no_purchase_order.
  - name: invoiced_qty
    data_type: decimal(18,4)
  - name: received_qty
    data_type: decimal(18,4)
  - name: line_net_amount_usd
    data_type: decimal(18,4)
  - name: qty_variance_pct
    data_type: decimal(18,4)
  - name: price_variance_pct
    data_type: decimal(18,4)
  - name: is_three_way_matched
    data_type: integer
    description: 1 when quantity and price agree within the match tolerances (open question 14).
  - name: is_maverick_spend
    data_type: integer
  - name: is_multi_delivery
    data_type: integer
  - name: invoice_line_count
