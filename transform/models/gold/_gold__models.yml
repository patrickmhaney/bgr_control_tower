# Contract C4: gold. Every model's columns and types are enforced - dbt fails
# the build if a model's output drifts from this file. Owners are required
# (python -m semantic.lint checks).
version: 2
models:
- name: dim_date
  time_spine:
    standard_granularity_column: date_day
    custom_granularities:
    - name: fiscal_quarter
      column_name: fiscal_quarter_start_date
    - name: fiscal_year
      column_name: fiscal_year_start_date
  description: One row per day. The conformed calendar and MetricFlow's time spine; fiscal periods follow
    var fiscal_year_start_month (open question 4).
  config:
    contract:
      enforced: true
    meta:
      owner: data-platform
  columns:
  - name: date_day
    data_type: date
    granularity: day
    tests:
    - unique
    - not_null
  - name: calendar_year
    data_type: integer
  - name: calendar_quarter
    data_type: integer
  - name: calendar_month
    data_type: integer
  - name: calendar_month_label
    data_type: varchar
  - name: calendar_quarter_label
    data_type: varchar
  - name: month_start_date
    data_type: date
  - name: fiscal_year
    data_type: integer
  - name: fiscal_quarter
    data_type: integer
  - name: fiscal_year_label
    data_type: varchar
  - name: fiscal_quarter_label
    data_type: varchar
  - name: fiscal_quarter_start_date
    data_type: date
  - name: fiscal_year_start_date
    data_type: date
- name: dim_customer
  description: One row per golden customer from MDM (contract C3). X3 wins financial attributes, HubSpot
    firmographics (open question 7). CRM-only companies stay in, so the unmatched rate is visible.
  config:
    contract:
      enforced: true
    meta:
      owner: data-platform
  columns:
  - name: customer_key
    data_type: varchar
    description: Golden customer key from MDM. UNKNOWN when the source record did not resolve.
    tests:
    - unique
    - not_null
  - name: customer_name
    data_type: varchar
  - name: x3_customer_code
    data_type: varchar
  - name: hubspot_company_id
    data_type: varchar
  - name: source_scope
    data_type: varchar
    description: 'both, erp_only or crm_only: which systems the golden customer appears in.'
  - name: match_rule
    data_type: varchar
  - name: match_score
    data_type: double
  - name: needs_steward_review
    data_type: integer
  - name: customer_group_code
    data_type: varchar
  - name: payment_term_code
    data_type: varchar
  - name: currency_code
    data_type: varchar
  - name: credit_limit_amount
    data_type: decimal(18,4)
  - name: primary_rep_code
    data_type: varchar
  - name: primary_rep_name
    data_type: varchar
  - name: industry
    data_type: varchar
  - name: employee_count
    data_type: double
  - name: domain
    data_type: varchar
  - name: country_code
    data_type: varchar
  - name: crm_company_count
    data_type: integer
  - name: crm_matched_company_count
    data_type: integer
  - name: first_seen_date
    data_type: date
    description: The earliest date either system knew this customer. MetricFlow's time dimension for customer
      metrics.
- name: dim_employee
  description: One row per golden employee from MDM, with the department their work counts toward (decision
    D7).
  config:
    contract:
      enforced: true
    meta:
      owner: data-platform
  columns:
  - name: employee_key
    data_type: varchar
    description: Golden employee key of the person who performed the activity. E-UNKNOWN for system users
      (EDI, WMS) and unresolved users.
    tests:
    - unique
    - not_null
  - name: employee_name
    data_type: varchar
  - name: email
    data_type: varchar
  - name: x3_user_code
    data_type: varchar
  - name: x3_rep_code
    data_type: varchar
  - name: hubspot_owner_id
    data_type: varchar
  - name: function_profile
    data_type: varchar
  - name: crm_team_name
    data_type: varchar
  - name: department_code
    data_type: varchar
    description: From the person's X3 function profile or HubSpot team, through seeds (decision D7).
    tests:
    - relationships:
        arguments:
          to: ref('dim_department')
          field: department_code
  - name: department_name
    data_type: varchar
- name: dim_department
  description: One row per department. Placeholders (open question Q-A).
  config:
    contract:
      enforced: true
    meta:
      owner: data-platform
  columns:
  - name: department_code
    data_type: varchar
    description: From the person's X3 function profile or HubSpot team, through seeds (decision D7).
    tests:
    - unique
    - not_null
  - name: department_name
    data_type: varchar
  - name: display_order
    data_type: integer
- name: dim_item
  description: 'One row per item: the X3 item master with Netstock planning attributes.'
  config:
    contract:
      enforced: true
    meta:
      owner: data-platform
  columns:
  - name: item_code
    data_type: varchar
