          field: item_code
  - name: site_code
    data_type: varchar
    description: X3 site code. UNKNOWN when it did not resolve.
    tests:
    - relationships:
        arguments:
          to: ref('dim_site')
          field: site_code
  - name: sales_order_number
    data_type: varchar
  - name: invoice_type_code
    data_type: varchar
  - name: payment_term_code
    data_type: varchar
  - name: document_currency_code
    data_type: varchar
  - name: invoiced_qty
    data_type: decimal(18,4)
  - name: line_net_amount_doc
    data_type: decimal(18,4)
  - name: line_net_amount_usd
    data_type: decimal(18,4)
  - name: is_settled
