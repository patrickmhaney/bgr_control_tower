# Golden answers: the acceptance test every semantic engine and BI tool must pass.
#
# Each query names metrics and dimensions the way the semantic layer does,
# carries an independent reference query written by hand against gold, and a
# frozen expected answer. `python -m evaluation.golden check` runs each
# query through the semantic service and through its reference SQL and
# requires all three to agree. A candidate tool (Cube, a Power BI model, a
# Fabric semantic model, Snowflake semantic views) passes when it reproduces
# `expected` from the same synthetic sources.
#
# Expected values hold for the sources as of `as_of` - the state after
# `make mock` and a first `make run`. Queries marked mdm_sensitive depend on
# which MDM provider ran and keep an answer per provider.
#
# Freeze new answers with `python -m evaluation.golden freeze` and review the
# diff: a changed number in this file is a changed number on a dashboard.

version: 1
as_of: '2026-09-05'
tolerance: 1.0e-06
