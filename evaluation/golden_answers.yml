- id: two_metrics_by_site
  metrics:
  - on_time_delivery_rate
  - return_rate
  group_by:
  - site__site_name
  reference_sql: "with otd as (\n  select s.site_name, sum(f.is_on_time) * 1.0 / sum(f.is_delivered) as\
    \ v\n  from gold.fct_delivery_line f join gold.dim_site s on s.site_code = f.site_code group by 1),\n\
    rr as (\n  select s.site_name, sum(f.returned_amount_usd) * 1.0 / sum(f.invoiced_amount_usd) as v\n\
    \  from gold.fct_sales_order_line f join gold.dim_site s on s.site_code = f.site_code group by 1)\n\
    select coalesce(otd.site_name, rr.site_name), otd.v, rr.v from otd full outer join rr on otd.site_name\
    \ = rr.site_name\n"
  expected:
  - - Dallas TX Distribution Center
    - 0.7133134836239898
    - 0.006287973665243482
  - - Reno NV Distribution Center
    - 0.6986919260261615
    - 0.01633018197491485
  - - Toronto ON Distribution Center
    - 0.6725502130249543
    - 0.008752772486739268
