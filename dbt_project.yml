name: bgr_control_tower
version: 1.0.0
config-version: 2

profile: bgr_control_tower

model-paths: ["models"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Which database the sources read from.
  #   raw           the output of run_ingestion.py (the normal path)
  #   mock_sources  the source systems directly, bypassing ingestion.
  #                 Used to prove the pipeline is lossless, and to keep the
  #                 project buildable by someone who has not run ingestion.
  source_database: raw

  # --- Documented assumptions. Every one of these is an open question in
  # --- docs/open_questions.md. They are vars so that reversing a business
  # --- decision is a config change, not a remodel.

  # Q1 On-Time Delivery promise basis: carrier | customer
  #     DECLARATIVE, like return_rate_basis. fct_shipment carries both
  #     is_on_time_vs_carrier_promise and is_on_time_vs_customer_request, and
  #     the metric YAML names the one it uses. This var only labels the fact.
  otd_promise_basis: carrier

  # Q10 Reporting currency and the FX policy used to get there.
  #     'derived' reads the implied rate out of the X3 GL (AMTLOC/AMTCUR).
  reporting_currency: USD
  fx_rate_source: derived

  # Shipment cost basis: charge_lines | shipment_header  (README landmine 13)
  shipment_cost_basis: charge_lines

  # Q3 Cost Per Order cost pool: fulfillment | fully_loaded
  cost_per_order_pool: fulfillment

  # Q4 Fiscal calendar. Placeholder until Finance confirms.
  fiscal_year_start_month: 1

  # X3 sentinel date meaning "no date"
  x3_null_date: '1753-01-01'

  # Q14 Three-way match tolerance. A match is "within tolerance" when both the
  #     quantity and the extended price agree with the receipt and the PO to
  #     within these percentages. Zero means exact. AP has not set a policy, so
  #     these are placeholders and the metric is provisional until they are.
  match_qty_tolerance_pct: 0.0
  match_price_tolerance_pct: 2.0

  # Q15 Inventory accuracy tolerance. Zero means a position is accurate only
  #     when the count equals the system quantity exactly. Many warehouses
  #     allow a band; Operations has not chosen one.
  inventory_accuracy_tolerance_pct: 0.0

  # Q16 Return Rate denominator basis: invoiced | ordered
  #     DECLARATIVE, like cost_per_order_pool. fct_sales_order_line carries
  #     both invoiced_amount_usd and line_net_amount_usd, following the same
  #     both-and pattern as the two on-time flags on fct_shipment, so switching
  #     basis is an edit to the denominator column in the metric YAML. This var
  #     records which one is live; changing it alone does nothing.
  return_rate_basis: invoiced

  # Relationship tests on the README's dashed lines warn instead of erroring.
  # Thresholds are documented in the model YAML next to each test.
  dashed_line_severity: warn

models:
  bgr_control_tower:
    +materialized: view
    staging:
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      core:
        +schema: core
        +materialized: table
        +tags: ["core"]
      metrics:
        +schema: metrics
        +materialized: view
        +tags: ["metrics", "generated"]
      process:
        +schema: process
        +materialized: view
        +tags: ["process"]

snapshots:
  bgr_control_tower:
    +target_schema: snapshot

seeds:
  bgr_control_tower:
    +schema: seed
    metric_registry:
      # Pin the free-text columns. When every metric is unblocked these are
      # empty in the CSV for every row, and dbt's type inference reads an
      # all-empty column as an integer - which then blows up on the first
      # query that touches it, not on the build. That failure was latent for
      # as long as at least one metric stayed blocked.
      +column_types:
        blocked_reason: varchar
        description: varchar
        owner: varchar
        owner_proposed: varchar
