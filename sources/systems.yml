# The source systems the architecture can simulate and stage. Each has a
# simulator (sources/simulators/<slug>.py) and a staging adapter
# (transform/platform/models/silver/staging/<slug>/). A pack's project.yml
# lists slugs from here; the requirements tool names a system by its name or
# by its type, and the compiler maps either to the slug.
sage_x3: {name: Sage X3, type: ERP}
hubspot: {name: HubSpot, type: CRM}
netstock: {name: Netstock, type: Inventory planning}
azure_cost: {name: Azure Cost, type: Cloud bill}
freight: {name: Freight platform, type: Freight platform}
