# Sample Project: the requirements tool's sample workspace (a fictional
# distributor) compiled onto the architecture. Its system types map to the
# architecture's simulators: ERP -> Sage X3, CRM -> HubSpot, Inventory
# planning -> Netstock, Freight platform -> freight. Payroll has none yet.
name: Sample Project
slug: sample
# Source systems in use. Each needs a simulator (sources/simulators/) and a
# staging adapter (transform/platform/models/silver/staging/<system>/).
systems: [sage_x3, hubspot, netstock, freight]
mdm_provider: splink
# The architecture version this pack is built and proven against (transform/platform).
architecture: 3.0.0
