# The people the requirements name, by id: who owns, who answers, who follows
# up. The only file in the project with names in it; every other file refers
# to a person by id. A metric's owner in the semantic files is a role, so
# picking a person as owner writes their role.

p1:
  name: Logistics Lead
  role: Operations
  department: OPS
