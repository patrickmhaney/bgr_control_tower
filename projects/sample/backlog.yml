# Metrics the business wants that have no formula yet. The Requirements tab
# adds them here; building one moves it to models/semantic/metrics.yml.
#
#   placeholder   the data exists; the business has not defined the metric
#   blocked       the data does not exist in any source system

metrics:

  - name: days_sales_outstanding
    label: Days Sales Outstanding
    status: placeholder
    owner: Finance
    description: How long, on average, customers take to pay us.
    placeholder_reason: >
      The agreed formula needs month-end receivable balances, which the warehouse
      doesn't hold yet.
    unblock_requires:
      - A month-end accounts receivable snapshot in gold.

  - name: cost_per_order
    label: Cost Per Order
    status: placeholder
    owner: TBD
    description: What it costs us to fulfil one customer order.
    placeholder_reason: 'Which costs count is open: freight only, or warehouse labour too.'

  - name: supplier_on_time_rate
    label: Supplier On-Time Rate
    status: placeholder
    owner: TBD
    description: The share of purchase order lines that arrive by the date the supplier promised.
    placeholder_reason: >
      Needs each receipt's promised date; the ERP keeps only a purchase order
      line's last receipt date.
    unblock_requires:
      - The promised date on each purchase order line receipt.
