  customer_prefixes: ["Northwind", "Vertex", "Ironclad", "Bluepeak", "Summit", "Cardinal", "Longview", "Redstone", "Halcyon", "Kestrel", "Meridian", "Ashford", "Brightwater", "Copperline", "Dovetail", "Eastgate", "Fairmount", "Granite", "Harborview", "Ivyridge", "Juniper", "Keystone", "Lakeshore", "Millbrook", "Northgate", "Oakhurst", "Pinehurst", "Quarry", "Riverbend", "Stonebridge", "Thornton", "Union", "Vanguard", "Westfield", "Yorkville"]
