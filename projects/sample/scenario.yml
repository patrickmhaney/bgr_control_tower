# Sample Project: the synthetic sources' settings (sources/generate.py reads them).
# A fictional distributor, smaller than Sample Project v2, with a freight platform.
# The generator draws from one seeded random generator, so changing any value here
# changes the data: re-freeze the golden answers and explain the diff.
# Unknown keys fail `python -m ctl check-pack`.

seed: 20261001
# Business activity starts here; the clock starts on initial_date and can advance to timeline_end.
start: 2024-07-01
initial_date: 2026-09-05
timeline_end: 2026-10-31

volumes:
  customers: 150
  items: 300
  suppliers: 30
  sales_reps: 18
  orders: 3000
  hs_companies: 180
  hs_contacts: 600
  hs_deals: 500

email_domain: bluepeak-supply.example

# Legal entities: X3 COMPANY (code, name, country, legislation).
companies:
  - ["BPSUS", "Bluepeak Supply Inc", "US", "USA"]
  - ["BPSCA", "Bluepeak Supply Canada Ltd", "CA", "CAN"]
# Sites: X3 FACILITY (code, name, company, short name, country, city, state).
sites:
  - ["US001", "Columbus OH Distribution Center", "BPSUS", "COLUMBUS", "USA", "Columbus", "OH"]
  - ["US002", "Phoenix AZ Distribution Center", "BPSUS", "PHOENIX", "USA", "Phoenix", "AZ"]
  - ["CA001", "Calgary AB Distribution Center", "BPSCA", "CALGARY", "CAN", "Calgary", "AB"]

# Item categories and the share of items in each.
item_categories:
  FG: 0.45
  RM: 0.25
  CMP: 0.22
  PKG: 0.08

# Name pools the generator draws from, in order.
