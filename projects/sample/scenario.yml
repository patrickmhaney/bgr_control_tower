  SALES: 0
  CSR: 3
  BUYER: 3
  WHSE: 5
  PLANNER: 2
  AR: 2
department_of_profile:
  SALES: SALES
  CSR: CUSTSVC
  BUYER: PURCH
  WHSE: OPS
  PLANNER: OPS
  AR: FIN
# HubSpot teams per function profile.
hubspot_teams:
  SALES: ["Field Sales - US", "Field Sales - Canada", "Inside Sales"]
  CSR: ["Customer Success"]

# The freight platform: carriers (code, name, mode, base rate per shipment in
# USD, share of shipments), how late invoices arrive, and its habits.
freight:
  carriers:
    - ["RDXP", "Ridgeline Express", "ltl", 185.0, 0.40]
    - ["NWFR", "Northway Freight", "ltl", 160.0, 0.30]
    - ["PCRG", "Pacific Cargo", "ftl", 640.0, 0.10]
    - ["SWCR", "Swift Courier", "parcel", 38.0, 0.20]
  invoice_lag_days: [3, 35]
  fuel_surcharge_pct: 0.18
  uninvoiced_rate: 0.03
  mangled_reference_rate: 0.04
