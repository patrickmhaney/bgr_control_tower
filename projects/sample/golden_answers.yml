# Golden answers: the acceptance test every semantic engine and BI tool must pass.
#
# Each query names metrics and dimensions the way the semantic layer does,
# carries an independent reference query written by hand against gold, and a
# frozen expected answer. `python -m evaluation.golden check` runs each query
# through the semantic service and through its reference SQL and requires all
# three to agree.
#
# Expected values hold for the sources as of `as_of` - the state after
# `make mock run PROJECT=sample`. Freeze new answers with
# `python -m evaluation.golden freeze` (CT_PROJECT=sample) and review the diff:
# a changed number in this file is a changed number on a dashboard.

version: 1
as_of: '2026-09-05'
tolerance: 1.0e-06
queries:
- id: on_time_delivery_total
  metrics:
  - on_time_delivery_rate
  reference_sql: select sum(is_on_time) * 1.0 / sum(is_delivered) from gold.fct_delivery_line
  expected:
  - - ''
    - 0.6941382091960204
- id: on_time_delivery_by_site
  metrics:
  - on_time_delivery_rate
  group_by:
  - site__site_name
  reference_sql: 'select s.site_name, sum(f.is_on_time) * 1.0 / nullif(sum(f.is_delivered), 0) from gold.fct_delivery_line
    f join gold.dim_site s on s.site_code = f.site_code group by 1

    '
  expected:
  - - Calgary AB Distribution Center
    - 0.697198275862069
  - - Columbus OH Distribution Center
    - 0.665742024965326
  - - Phoenix AZ Distribution Center
    - 0.7223869532987398
- id: on_time_delivery_by_carrier
  metrics:
  - on_time_delivery_rate
  group_by:
  - carrier__carrier_name
  reference_sql: 'select c.carrier_name, sum(f.is_on_time) * 1.0 / nullif(sum(f.is_delivered), 0) from
    gold.fct_delivery_line f join gold.dim_carrier c on c.carrier_code = f.carrier_code group by 1

    '
  expected:
  - - Northway Freight
    - 0.7031451960361913
  - - Pacific Cargo
    - 0.7082228116710876
  - - Ridgeline Express
    - 0.6863885088919288
  - - Swift Courier
    - 0.6879777623349548
- id: on_time_delivery_by_quarter
