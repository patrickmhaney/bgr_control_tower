# Each measure's discovery answers, by metric name. Its label, description,
# owner and caveats are its definition, in the semantic files
# (models/semantic/metrics.yml, or backlog.yml until it has a formula).
# Questions: core/requirements/questions.yml.

win_rate:
  interview: in_progress
  followup: true
  followup_note: A working definition until Sales confirms it (open question Q-B).
  unknown: {target: VP Sales, report: '', sme: VP Sales, restatement: '', owner: VP Sales}
  answers:
    formula: Deals won divided by Deals closed.
    sources: [HubSpot]
    dimensions: [date, department]
    time: Created date. Calendar months.
    refresh: daily
    refresh_why: The pipeline runs every morning.

pipeline_value:
  interview: in_progress
  followup: true
  followup_note: A working definition until Sales confirms it (open question Q-B).
  unknown: {target: VP Sales, report: '', sme: VP Sales, restatement: '', owner: VP Sales, formula: ''}
  answers:
    sources: [HubSpot]
    dimensions: [date, department]
    time: Created date. Calendar months.
    refresh: daily
    refresh_why: The pipeline runs every morning.

sales_cycle_days:
  interview: in_progress
  followup: true
  followup_note: A working definition until Sales confirms it (open question Q-B).
  unknown: {target: VP Sales, report: '', sme: VP Sales, restatement: '', owner: VP Sales}
