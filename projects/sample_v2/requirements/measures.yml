    formula: Days to win (sum) divided by Deals won.
    sources: [HubSpot]
    dimensions: [date, department]
    time: Created date. Calendar months.
    refresh: daily
    refresh_why: The pipeline runs every morning.

on_time_delivery_rate:
  interview: in_progress
  followup: true
  followup_note: >-
    Measured against the customer's requested date. Whether the promise should
    be the requested date or a confirmed ship date is open question 1.
  unknown: {target: VP Operations, report: '', sme: VP Operations, restatement: '', owner: VP Operations}
  answers:
    formula: On-time delivery lines divided by Delivered lines.
    sources: [Sage X3]
    dimensions: [date, customer, department, site]
    time: Ship date. Calendar months.
    refresh: daily
    refresh_why: The pipeline runs every morning.

return_rate:
  interview: in_progress
  followup: true
  followup_note: >-
    The denominator (invoiced value) and the date basis (order date) are open
    questions 16 and 17.
  unknown: {target: Director of Customer Service, report: '', sme: Director of Customer Service, restatement: '', owner: Director of Customer Service}
  answers:
    formula: Returned value divided by Invoiced value.
    sources: [Sage X3]
    dimensions: [date, customer, department, site]
    time: Order date. Calendar months.
    refresh: daily
    refresh_why: The pipeline runs every morning.

dso_days_to_pay_proxy:
  interview: in_progress
  followup: true
  followup_note: A days-to-pay proxy, not a balance-based DSO. Open question 2.
  unknown: {target: Controller, report: '', sme: Controller, restatement: '', owner: Controller}
  answers:
    formula: Days to pay (sum) divided by Settled invoice lines.
    sources: [Sage X3]
    dimensions: [date, customer, site]
    time: Invoice date. Calendar months.
    refresh: daily
    refresh_why: The pipeline runs every morning.

order_fill_rate:
