# Generated from transform/platform/project_template.yml: only `name` and
# `vars` may differ from it (python -m ctl check-pack).
name: sample_v2
version: 3.0.0
config-version: 2
profile: control_tower

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  # Staging adapters (in the platform package) read the pack's bronze models.
  require_ref_searches_node_package_before_root: true

# The platform package's default__generate_schema_name names schemas by layer.
dispatch:
  - macro_namespace: dbt
    search_order: ["platform", "dbt"]

vars:
  # Documented assumptions. Each is an open question in docs/open_questions.md;
  # they are vars so reversing a business decision is a config change.

  # Q4 Fiscal calendar. 1 means fiscal = calendar until Finance confirms.
  fiscal_year_start_month: 1
  # Q10 Reporting currency. Rates are derived from the X3 GL (AMTLOC/AMTCUR).
  reporting_currency: USD
  # Q14 Three-way match tolerance, percent. Zero means exact.
  match_qty_tolerance_pct: 0.0
  match_price_tolerance_pct: 2.0
  # Q15 Inventory accuracy tolerance, percent. Zero means exact.
  inventory_accuracy_tolerance_pct: 0.0
  # Relationship tests on known-dirty joins warn instead of failing the build.
  dirty_join_severity: warn

models:
  sample_v2:
    +materialized: view
    bronze:
      +schema: bronze
      +materialized: table
      +tags: ["bronze"]
    silver:
      +schema: silver
      intermediate:
        +tags: ["intermediate"]
      conformed:
        +materialized: table
        +tags: ["conformed"]
    gold:
      +schema: gold
      +materialized: table
      +tags: ["gold"]
      +contract:
        enforced: true

seeds:
  sample_v2:
    +schema: seed
