# What the Studio's map shows. The tools in each stack, the
# technical contract and the conformance test come from
# evaluation/components.yml; this file only adds the layout and the copy.
#
# swap: the cost of moving from the baseline to that stack's tool, where it
# differs from components.yml's single swap_cost. same = the same tool;
# none = the stack has nothing for this job.

stacks:
  - {id: baseline, label: Open source, note: Implemented in this repository}
  - {id: existing, label: Existing stack, note: "Azure Data Factory, Azure SQL Managed Instance, Power BI"}
  - {id: mix_1, label: "Mix 1 · Boomi + Fabric", note: "Boomi Data Integration and Data Hub, Microsoft Fabric"}
  - {id: mix_2, label: "Mix 2 · Snowflake + Fivetran", note: "Fivetran, Snowflake, Profisee"}

swap_costs:
  same: {label: Same tool, effort: ""}
  adapter: {label: Adapter, effort: days}
  port: {label: Port, effort: weeks}
  rebuild: {label: Rebuild, effort: weeks to months}
  none: {label: Not covered, effort: ""}
  stays: {label: Platform, effort: ""}

columns:
  - {id: sources, label: Source systems}
  - {id: collect, label: Collect}
  - {id: raw, label: Raw history}
  - {id: clean, label: Clean and connect}
  - {id: star, label: Star schema}
  - {id: semantic, label: Semantic layer}
  - {id: use, label: Use}

nodes:
  - id: sage_x3
    column: sources
    kind: source
    role: ERP
    tool: Sage X3
    what: Sales orders, deliveries, invoices, purchasing, inventory and general ledger.
  - id: hubspot
    column: sources
    kind: source
    role: CRM
    tool: HubSpot
    what: Companies, contacts, deals and pipeline stages.
  - id: netstock
    column: sources
    kind: source
    role: Inventory planning
    tool: Netstock
    what: Demand forecasts, forecast accuracy and replenishment recommendations.
  - id: azure_cost
    column: sources
    kind: source
    role: Cloud bill
    tool: Azure Cost
    what: Azure cost export for this platform, by component.

  - id: ingestion
    column: collect
    component: ingestion
    role: Ingestion and change capture
    tool: dlt
    what: Extracts inserts, updates and deletes since the last run. Uses SQL Server CDC for X3 and API queries for HubSpot and Netstock.
    step: collect

  - id: raw_storage
    column: raw
    component: raw_storage
    role: Raw storage
    tool: Azure Data Lake
    what: Append-only history of every extracted record, stored as Delta tables. Any table can be rebuilt as of a past date.
    swap: {existing: port, mix_1: adapter, mix_2: adapter}
    step: collect

  - id: transformation
    column: clean
    component: transformation
    role: Transformation
    tool: dbt
    what: Staging, joins across systems and the gold tables, as SQL models with data tests.
    swap: {existing: rebuild, mix_1: port, mix_2: port}
    swap_note: Port if the models stay in dbt (dbt supports Fabric and Snowflake). Rebuild if they move to another tool.
    step: clean

  - id: mdm
    column: clean
    component: master_data_management
    role: Master data
    tool: Splink
    what: Matches customers across X3 and HubSpot, and employees across systems, and assigns a golden ID to each.
    step: match

  - id: warehouse
    column: star
    component: warehouse_storage
    role: Warehouse
    tool: DuckDB
    what: Fact tables (order lines, deliveries, invoices, deals) and dimensions (customer, item, site, employee).
    step: model

  - id: semantic
    column: semantic
    component: semantic_modeling
    kind: heart
    role: Semantic layer
    tool: MetricFlow
    what: Metric definitions in YAML, with owner, status and caveats. Dashboards, marts, the API and AI tools all compute from these definitions.
    step: metrics
    opens: {view: gov, label: See the governance it drives}

  - id: powerbi
    column: use
    component: visualization
    role: Dashboards
    tool: Power BI
    what: Imports one precomputed metrics table. Measures are generated from three templates; there is no hand-written DAX.
    step: metrics
  - id: marts
    column: use
    component: downstream_apps
    role: Data marts and apps
    tool: Postgres
    what: Metric tables loaded into Postgres for other applications.
    step: serve
  - id: api
    column: use
    role: API
    tool: REST + MCP
    fixed: true
    what: REST API and MCP server. Returns any metric by any valid dimension, with its status and caveats.
    step: serve
  - id: ai
    column: use
    component: applied_ai
    role: AI assistants
    tool: Claude
    what: Answers metric questions through the MCP server.
    step: serve

foundation:
  - id: cloud
    component: cloud_infrastructure
    role: Cloud
    tool: Azure
    what: Azure resources defined in Bicep, with budgets and alerts per environment.
  - id: orchestration
    component: orchestration
    role: Orchestration
    tool: Dagster
    what: Schedules the pipeline steps. Holds no business logic.
  - id: assurance
    role: Assurance
    tool: Contracts, tests and golden answers
    fixed: true
    kind: keep
    what: Contracts between components, conformance tests, and golden answers. Used to verify a replacement component.

edges:
  - {from: sage_x3, to: ingestion, contract: C1}
  - {from: hubspot, to: ingestion, contract: C1}
  - {from: netstock, to: ingestion, contract: C1}
  - {from: azure_cost, to: ingestion, contract: C1}
  - {from: ingestion, to: raw_storage, contract: C2}
  - {from: raw_storage, to: transformation}
  - {from: mdm, to: transformation, contract: C3, vertical: true}
  - {from: transformation, to: warehouse, contract: C4}
  - {from: warehouse, to: semantic, contract: C5}
  - {from: semantic, to: powerbi, contract: C7}
  - {from: semantic, to: marts, contract: C7}
  - {from: semantic, to: api, contract: C6}
  - {from: api, to: ai, vertical: true}

contracts:
  # files: what defines the contract, shown in the Studio (from = the first
  # line to show, lines = how many). suites: what the "Run tests" button runs.
  # kind is pytest, dbt, verify, golden or parity (apps/studio/contracts.py).
  C1:
    name: Source specification
    promise: Tables, keys and extraction method for each source.
    proof: Ingestion is generated from the specification files.
    files:
      - {path: ingestion/specs/sage_x3.yml, lines: 60}
      - {path: ingestion/specs/hubspot.yml, lines: 60}
      - {path: ingestion/specs/netstock.yml, lines: 60}
    enforced: No separate test. The extraction code reads these files directly, so it cannot drift from them.
    suites: []
  C2:
    name: Raw history
    promise: Append-only change log per source table, deletes included, with source column names. A schema change fails the load.
    proof: Each source table rebuilt from raw history is compared with the source, row by row.
    files:
      - {path: ingestion/schemas/sage_x3.schema.yaml, from: "  COMPANY:", lines: 70}
      - {path: transform/macros/bronze_current.sql, lines: 70}
    suites:
      - {kind: verify, title: Source tables against raw history}
      - {kind: pytest, title: "Full simulation: CDC, a retention gap and hard deletes",
         path: tests/conformance/test_ingestion_convergence.py, optional: true,
         note: Runs in a temporary folder. About 2 minutes.}
  C3:
    name: Golden IDs
    promise: Each customer and employee record maps to one golden ID.
    proof: Schema and coverage checks, plus precision and recall against a labelled answer key.
    files:
      - {path: mdm/contract.yml, lines: 80}
    suites:
      - {kind: pytest, title: MDM contract tests, path: tests/conformance/test_mdm_contract.py}
  C4:
    name: Star schema
    promise: Fixed columns and types for every fact and dimension table.
    proof: dbt enforced contracts and relationship tests.
    files:
      - {path: transform/models/gold/_gold__models.yml, from: "- name: fct_sales_order_line", lines: 80}
    suites:
      - {kind: dbt, title: dbt tests on the gold tables, select: "path:models/gold"}
  C5:
    name: Metric definitions
    promise: One definition per metric, with owner, status and caveats.
    proof: "Golden answers: each query runs through the semantic layer and through reference SQL, and both are compared with the frozen result."
    files:
      - {path: transform/models/semantic/metrics.yml, from: "  - name: on_time_delivery_rate", lines: 60}
      - {path: evaluation/golden_answers.yml, from: "queries:", lines: 60}
    suites:
      - {kind: golden, title: Golden answers}
      - {kind: pytest, title: Governance lint and SQL portability, path: tests/conformance/test_governance.py}
  C6:
    name: API and MCP tools
    promise: Published REST endpoints and MCP tools. Invalid requests return a reason.
    proof: Contract tests on the OpenAPI spec and the MCP tool list.
    files:
      - {path: tests/conformance/test_data_service.py, lines: 70}
    suites:
      - {kind: pytest, title: API and MCP contract tests, path: tests/conformance/test_data_service.py}
  C7:
    name: Dashboard tables
    promise: One table per saved query, plus the combined table Power BI imports.
    proof: Golden answers recomputed with the Power BI measure templates.
    files:
      - {path: powerbi/ControlTower.SemanticModel/definition/tables/dashboard_cube.tmdl, lines: 60}
      - {path: transform/models/semantic/saved_queries.yml, lines: 85}
    suites:
      - {kind: parity, title: Golden answers through the Power BI measure templates}
      - {kind: pytest, title: Dashboard table structure, path: tests/conformance/test_dashboard_cube.py,
         exclude: [test_golden_answers_through_the_cube]}

keeps:
  - {id: contracts, label: Contracts between components}
  - {id: metrics, label: Metric definitions, note: "with owner, status and caveats", opens: gov}
  - {id: golden, label: Golden answers, note: "prove every KPI's numbers", opens: gov}
  - {id: star, label: Star schema tables}

# The Governance screen: what each lifecycle stage means. The live parts (the
# catalog, ownership, golden answers, the audit log) are read from the
# repository, not from here.
governance:
  stages:
    - id: blocked
      label: Blocked
      means: The data does not exist in any source system.
      next: A source is brought into scope.
    - id: placeholder
      label: Placeholder
      means: The data exists; the business has not defined the metric.
      next: The owner agrees a working definition.
    - id: provisional
      label: Provisional
      means: A working definition with an open question.
      next: The open question is answered and the owner signs off.
    - id: active
      label: Active
      means: Agreed. Shown without a warning.
      next: A change is a reviewed change to metrics.yml and a re-frozen golden answer.
