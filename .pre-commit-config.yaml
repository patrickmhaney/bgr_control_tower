# pre-commit install   (once per clone)
repos:
  - repo: local
    hooks:
      - id: blocked-words
        name: blocked words (.blocked_words, never committed)
        entry: uv run python -m checks.blocked_words
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
